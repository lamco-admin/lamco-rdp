[graph]
all-features = true

[advisories]
ignore = []

[licenses]
# The full dependency graph (all features, incl. the optional image stack and
# the IronRDP cliprdr/pdu transitive tree) is permissive-only. This list is the
# union of what is present plus the usual permissive set; unused entries do not
# error thanks to unused-allowed-license below.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
